# Render Blueprint: backend (Docker) + PostgreSQL
databases:
  - name: uniskill-db
    plan: free
    databaseName: uniskill

services:
  - type: web
    name: uniskill-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: uniskill-db, property: connectionString }
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        sync: false        # Vercel manzilingizni kiriting, masalan https://uniskill.vercel.app
      - key: ANTHROPIC_API_KEY
        sync: false        # ixtiyoriy; bo'lmasa AI qoidalarga asoslangan ishlaydi
      - key: SEED_DEMO
        value: "1"         # haqiqiy foydalanuvchilar uchun "0" qiling
      - key: UNIVERSITY_EMAIL
        sync: false
      - key: UNIVERSITY_PASSWORD
        sync: false
